apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: heartbeat
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: heartbeat
          image: docker.io/library/sandbox-heartbeat:dev
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
